# =============================================================================
# 经纬 JingWei-P (pico) : 专门为「无 Tensor Core 的老卡」(GTX 1660 SUPER /
# GTX 1660 Ti / GTX 1650 等 TU116/TU117) 在 1280x1280 下达到实时而裁剪。
#
# 相对 jingwei_n 的削减（目标 MACs 从 15.65 G 降到 ~7 G）：
#   width 1.0 -> 0.75          主干/头通道 ~0.75^2 计算量
#   num_blocks [2,2,1] -> [1,1,1]
#   recon_blocks 4 -> 2, recon_dim 256 -> 192   线性注意力分支 -60%
#   grid 80 -> 64, out_grid 160 -> 128         记忆库与后处理 -36%
#   n_centroids 256 -> 128, patch_dim 128 -> 96
#   roi_head 关闭（TRT 图无需额外导出 n3/n5，也省一次 ROI 池化）
#   top_k 300 -> 150
#
# 保留：LocalContrastNorm（去反光）、布种原型、双无监督信号、安全网。
# 也就是说「大缺陷不漏」的机制完整保留，只砍算力。
# =============================================================================
name: jingwei_p
input_size: [1280, 1280]

data:
  nc: 19
  dataset_yaml: configs/fabric19.yaml
  names: ['纬线杂质', '断纬', '多股线', '纬线不直', '包边不重叠', '捻接器接头',
          '小尾巴', '经线毛球', '包边不良', '手工接头', '纬斜', '短废纱线',
          '单根包不进', '棉团', '蚊虫小黑点', '小布头', '稀缝', '油点线', '飘絮']

model:
  width: 0.75
  depth: 1.0
  stem_ch: 24
  detail_ch: 48
  p3_ch: 96
  p4_ch: 192
  p5_ch: 384
  num_blocks: [1, 1, 1]          # 原来是 [2,2,1]
  neck_blocks: 1
  head_width: 0.5
  attn_p5: true
  attn_heads: 6                  # 整除 c5 = 288 -> d = 48
  dwconv: true                   # 1660S 上若测出 DWConv 反而慢，设 false 做 A/B
  reflection_norm: true
  lcn_k: 11
  balance_p3: 1.0
  balance_p5: 1.0
  top_k: 150
  # 只保留一个下发阈值（v0.2.2，见 docs/CODE_REVIEW.md §2.13）：
  # model.score_thresh 与 fusion.final_score_thresh 是同一个"绝对阈值"，
  # 以前一个 0.05、一个 0.15，导致 decode 放出来的框又被 fusion 丢掉，
  # 日志里的 cand>conf / out 两个数永远对不上。两个键必须相等。
  score_thresh: 0.15
  reg_scale: 1.0
  fg_align: true
  # NMS-free 解码仍然必须做"峰值"解码：o2o 分支在缺陷附近是一整片高原，
  # 只做 top-k + 阈值会把高原上每个 cell 变成一个框（实测一个缺陷 144 个框，
  # 即 1 TP + 143 FP —— 这是 precision 上不去的直接原因）。
  peak_filter: true             # 只保留 3x3 局部极大值（每个目标一个峰）
  peak_kernel: 3                # 1 = 关闭峰值过滤（退回旧行为，用于 A/B）
  # 冷启动先验（logit 空间）。**bias 不是冷启动的瓶颈**——v0.2.2 的受控探针
  # （head-only，冻结真实 backbone 特征，320²，AdamW 2e-3）：bias=-4 时部署分支的
  # 正样本 objectness 在 **9 步**内就从 0.06 涨到 0.98，因为 1x1 conv 是靠
  # **权重**（h 个通道）抬起 logit 的，不需要 bias 走完整段路。
  # 反过来说，把 bias 预置得越高，背景电平越高、越难压回去（200 步后的背景 p99）：
  #   bias -4 → 0.063   bias -2 → 0.119   bias -1 → 0.146（且偶发正样本塌回 0.13）
  # 所以保持 -4.0；它只作为调试开关暴露。真正让门打开的是 objectness 读 reg stem
  # （obj_head_from）、部署分支的 loss 份额（loss_weights.obj_o2o）和背景压力
  # （obj_o2o_neg_weight）这三项。
  obj_bias_init: -4.0
  cls_bias_init: -2.0
  # objectness 读哪一层特征：reg = 回归 stem + 自带 3x3→5x5 DWConv stem（默认，
  # v0.2.2；感受野 9 cell ≈72 px @stride8，代价 +2.1% MACs）；neck = 旧的 1x1 裸卷积。
  # 受控 A/B（冻结真实特征的 head-only 探针，300 步）：neck 时部署分数只有 0.033
  # = 门永远打不开；reg 时 0.52~0.95。这是本轮唯一"非它不可"的改动。
  obj_head_from: reg
  # v0.2.4: objectness 走 f_reg + DWConv(3x3)->DWConv(5x5) 的残差路径。
  # 只用 5x5 平滑时无法表示"单 cell 峰"，网络只能靠抬高整张图的水位来满足
  # 正样本（实测 obj_mean=0.148 ≈ 阈值 0.15 -> 82 框/图）。残差 0 参数、0 MACs。
  obj_head_residual: true

normality:
  enabled: true
  grid: 64                       # 原 80
  out_grid: 128                  # 原 160（必须是 grid 的整数倍）
  patch_dim: 96                  # 原 128
  local_pool: 3
  n_prototypes: 8
  n_centroids: 128               # 原 256
  coreset_ratio: 0.1       # NOTE: 未使用；压缩率实际由 n_centroids 决定
                           # (tools/build_memory_bank.py)，见 docs/CODE_REVIEW.md
  bank_method: spherical_kmeans
  seed: 0
  recon_dim: 192                 # 原 256
  recon_blocks: 2                # 原 4
  recon_heads: 6                 # 整除 192 -> d = 32
  recon_mlp_ratio: 2.0
  recon_ratio: 4.0
  dropout: 0.2
  jitter: 0.3
  rec_tau: 0.10
  rec_slope: 12.0
  fusion: fixed                  # 省掉一个可学习融合门
  alpha: 0.6
  beta: 0.4
  target_fpr: 0.005

fusion:
  anomaly_logit_gain: 1.0
  anomaly_thresh: 0.5
  large_area_ratio: 0.001
  min_iou_overlap: 0.1
  score_boost: 0.35
  box_margin: 1.15
  min_box_px: 24
  unknown_score_scale: 0.9
  emit_unknown_boxes: true        # 未知疵点类型也生成预测框（不止大缺陷兜底）
  unknown_min_area_ratio: 0.0002  # 比 large_area_ratio 更小，约 5 个 anomaly cell @160²
  unknown_peak_thresh: 0.55       # 小未知区域需要更高异常峰值，抑制噪声
  max_unknown_boxes: 20           # 每帧最多额外未知框（大缺陷框不受此限制）
  final_score_thresh: 0.15
  roi_head: false                # 关闭二级 ROI，分类仍由监督头 + 融合提供
  roi_hidden: 128
  roi_prior_weight: 0.5

train:
  # 按"推理时谁真的跑"分配权重（v0.2.3，见 CODE_REVIEW §0.9）。
  # 实测（epoch 9，原始值）：box_o2m 1.31 / obj_o2m 1.66 / cls_o2m 0.46 /
  #                         cls_o2o 0.30 / box_o2o 0.45 / obj_o2o 0.10
  # 用旧权重（box_o2m 2.0, obj_o2m 1.0, obj_o2o 1.5）乘出来是
  #   box_o2m 38% / obj_o2m 24% / box_o2o 9% / cls_o2m 7% / cls_o2o 5% / obj_o2o 2%
  # —— **62% 的梯度给了推理时不跑的 o2m 分支**，而唯一决定"出不出框"的
  # obj_o2o 只有 2%。它当然学不会"这块布上没有东西"，于是 55~85 框/图、
  # normal_fpr=1.0、precision 0.3%。
  # 下面这组把部署分支（obj_o2o+cls_o2o+box_o2o）拉到 ~40%（按上面原始值算：
  # 13% + 12% + 14%），obj_o2o 从 2% 升到 ~13%。
  # 注意 obj_o2o 的"值"天生很小（平衡 focal，背景学会后接近 0），所以权重必须大：
  # 这是"权重 × 量级"的问题，不是损失本身有问题。
  # v0.2.4: obj_o2o 10 -> 8，box_o2o 2.5 -> 3.0。部署分支（o2o 三项）仍占 ~55%，
  # 但 o2o 的"背景水位"改由 obj_o2o_neg_weight 负责（见下），回归不再被压。
  loss_weights: {cls_o2m: 0.9, box_o2m: 1.0, obj_o2m: 0.3,
                 cls_o2o: 3.0, box_o2o: 3.0, obj_o2o: 8.0, fg_align: 0.5}
  class_weights: null
  o2o_candidates: 1200
  o2o_neg_ratio: 0.02       # per-scale hard negatives as a fraction of all cells
  o2o_min_neg: 2048
  # v0.2.4: o2o 的匈牙利匹配只在"每个 GT 自己的中心区域"内选正样本（radius 单位
  # = stride，与 o2m 的 FCOS 中心采样同一规则）。旧实现从当前 score 的 top-k 里挑，
  # 等于让回归去拟合一个离目标几百像素的 cell —— 学不到（退化成数据集平均尺寸），
  # 同时把"有目标"教在普通布面上，而且自我强化、换任何权重都救不回来。
  o2o_radius: 1.5
  # o2o（部署分支）objectness 的监督方式：
  #   focal = 全网所有 cell 都参与 focal loss（默认，背景不会被漏掉）
  #   ohem  = 只对最难的 ~8% 负样本做 hard mining（旧行为；p=0 的
  #           简单背景 cell 拿不到梯度，会留下无法用阈值消除的误报）
  # 注意：focal 现在是"平衡"归一化（正样本均值 + 负样本均值），量级与
  #      其它项可比，所以 obj_o2o 权重回到 1.5（曾误调到 0.5，导致唯一
  #      决定出框的分支只占 loss 的 0.7%）。
  obj_o2o_mode: focal
  obj_o2o_gamma: 2.0
  obj_o2o_alpha: 0.5          # 正样本比例 0.1%~1%，alpha=0.25 是在惩罚前景
  obj_o2o_neg_weight: 6.0     # 负样本均值项的权重。这一项是"背景水位"的唯一
                              # 来源：正样本只有每图 ~8 个 cell，负样本 25k 个，
                              # 两者在权值空间里打架，结果是整张图被抬到 p ~ 1/w_n。
                              # 2.5 时实测 obj_mean=0.148，正好压在 0.15 的阈值上
                              # （= 82 框/图、precision 0.3%，见 §0.10）；6.0 对应
                              # p ~ 0.06，留出安全余量。不要再往上调，正样本侧的
                              # 压力由 loss_weights.obj_o2o 独立控制。
  obj_o2m_neg_weight: 2.0     # o2m 分支同样加背景压力（1.0 = 纯 50/50）
  cls_o2m_neg_weight: 2.0     # 分类背景压低 => score=obj*cls 的乘积更干净
  obj_quality_floor: 0.0      # 质量目标下限；0.5 会把"定位很差的匹配"教成
                              # objectness=0.5，比背景(0.02)还像目标。目标的
                              # 冷启动行为由 build_dense_targets 的 qmax 混合
                              # 自动兜底（qmax~0 时目标恒为 1.0）
  cls_quality_target: false   # 分类目标用 one-hot，而不是乘上 IoU 质量
  obj_o2m_pos_weight: 1.0     # 平衡归一化已经给正样本 50% 份额；再乘 4 会让
                              # 训练分支 objectness 占到总 loss 的 60%（实测）
  cls_o2m_pos_weight: 1.0
  # 纯负样本混合（v0.2.3）：每个 batch 有这么大比例的图来自 normaltrain（**无框**）。
  # 阶段 A 以前一张正常布都没见过，"整帧无目标"是没学过的样本；混进来以后
  # "整帧都是正常纹理 => objectness 全 0" 才成为一条被显式监督的样本。
  # 这是降 normal_fpr 最便宜的一招。0 = 关闭（--normal-frac 可临时覆盖）。
  normal_image_frac: 0.25
  rec_p_final: 0.9
  rec_warmup: 1000
  rec_factor: 0.1
  rec_weight: 0.5
  detector_epochs: 150
  detector_batch: 8
  detector_lr: 0.002
  normality_iters: 10000
  normality_batch: 8
  normality_lr: 0.0005
  weight_decay: 0.0005

# Stage 0: 1660S 上训练也可以用 DINOv2 teacher；推理图仍然只有 pico CNN。
dino:
  teacher: dinov2_vits14
  repo: facebookresearch/dinov2
  weights: null
  crop: 448
  iters: 5000
  batch: 4
  lr: 0.0005
  loss_weights: {n3: 1.0, n5: 1.0, rec: 1.0, patch: 0.5}

# 1660S 也要前景/背景分离；context 只有 3 通道，增加的 MACs < 0.05 G
foreground:
  enabled: true
  mode: local_global_attention
  hidden: 24                    # local conv branch channels
  attention_dim: 64             # global token dim (LinearAttention2)
  attention_heads: 4
  attention_blocks: 2
  boundary_kernel: 5            # ONLY smooths training pseudo labels, not deployed
  fold_attenuation: 0.80        # dynamic fold_band attenuation (no fixed edge pixels)
  texture_thresh: 0.20          # weave-energy -> pseudo fabric_mask
  slope: 30.0
  target_shrink: 0.08
  pos_weight: 5.0
  loss_weight: 0.5
  fabric_loss_weight: 1.0
  fold_loss_weight: 0.5
  global_loss_weight: 0.2
  fabric_mask_thresh: 0.30
  fold_band_thresh: 0.08
  defect_fg_thresh: 0.25
  min_fabric_frac: 0.50
  use_aspect_cue: false         # primary cue is learned fold_band, not shape heuristic
  fold_aspect_ratio: 3.0        # optional secondary cue
  fold_peak_override: 0.80

deploy:
  # 1660S 可以用 TensorRT，但 TU116 没有 Tensor Core；术语见 DEPLOYMENT.md §4.1
  half: false                    # 先 FP32，再 A/B 测 FP16（FP16 可能更慢）
  int8: false                    # 无 INT8 Tensor Core，DP4A 收益不确定
  opset: 17
