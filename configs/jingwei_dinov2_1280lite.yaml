# Direct official pretrained DINOv2 detector. No offline distillation.
# dino_input_size must be a multiple of 14. Encoder remains at inference.
name: jingwei_dinov2_1280lite
input_size:
- 1280
- 1280
data:
  nc: 19
  dataset_yaml: configs/fabric19.yaml
  names:
  - 纬线杂质
  - 断纬
  - 多股线
  - 纬线不直
  - 包边不重叠
  - 捻接器接头
  - 小尾巴
  - 经线毛球
  - 包边不良
  - 手工接头
  - 纬斜
  - 短废纱线
  - 单根包不进
  - 棉团
  - 蚊虫小黑点
  - 小布头
  - 稀缝
  - 油点线
  - 飘絮
model:
  backbone: dinov2
  dino_name: dinov2_vits14
  dino_repo: facebookresearch/dinov2
  dino_weights: null
  dino_pretrained: true
  dino_freeze: true
  dino_input_size: 224
  # Keep PAN at 640 while the native fine head runs on the 1280/8 grid.
  pyramid_size: 640
  # Native 1280-pixel texture route, fused into P3; no second ViT pass.
  local_detail: true
  dino_lr_mult: 0.1
  reg_activation: softplus
  detector_nms_iou: 0.5
  width: 0.5
  depth: 1.0
  detail_ch: 48
  p3_ch: 96
  p4_ch: 192
  p5_ch: 384
  neck_blocks: 1
  head_width: 0.5
  dwconv: true
  balance_p3: 1.0
  balance_p5: 1.0
  top_k: 64
  score_thresh: 0.05
  reg_scale: 1.0
  fg_align: true
train:
  loss_weights:
    cls_o2m: 1.0
    box_o2m: 2.0
    obj_o2m: 1.0
    cls_o2o: 1.5
    box_o2o: 2.0
    obj_o2o: 1.5
    fg_align: 0.5
  class_weights: null
  o2o_candidates: 1200
  o2o_neg_ratio: 0.02
  o2o_min_neg: 2048
  # Per-image class hard negatives; positives use hard class labels, not CIoU.
  cls_min_neg: 256
  cls_neg_ratio: 3.0
  # Matched deployed objectness learns IoU, with a small bootstrap floor.
  o2o_quality_floor: 0.05
  best_metric: best_f1
  warmup_epochs: 1
  detector_epochs: 50
  # A longer --epochs budget must not silently stretch the LR decay to 500 epochs.
  lr_decay_epochs: 50
  detector_batch: 2
  detector_lr: 0.0005
  weight_decay: 0.0005
  normal_ratio: 0.5
inference:
  final_score_thresh: 0.15
  large_area_ratio: 0.001
# Shared-feature novelty is calibrated separately, not an extra ViT pass.
unknown:
  enabled: true
  # Fixed native stride-8 descriptor bank alongside frozen DINO prototypes.
  texture_detail: true
  prototypes: 32
  momentum: 0.95
  min_patches: 1
  max_regions: 8
