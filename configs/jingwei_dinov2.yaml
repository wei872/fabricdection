# Direct official pretrained DINOv2 ViT-B/14 detector. NO stage-0 distillation.
# Frozen encoder + trainable pyramid/PAN/head; accuracy experiment, NOT pico realtime.
# Starts with batch 2 for laptop GPUs; lower to 1 on OOM.
# DINO sees 448x448 while detection coordinates stay 1280x1280.
# For tiny defects try dino_input_size: 672 (multiple of 14), at extra memory/latency cost.
name: jingwei_dinov2
input_size: [1280, 1280]

data:
  nc: 19
  dataset_yaml: configs/fabric19.yaml
  names: ['纬线杂质', '断纬', '多股线', '纬线不直', '包边不重叠', '捻接器接头',
          '小尾巴', '经线毛球', '包边不良', '手工接头', '纬斜', '短废纱线',
          '单根包不进', '棉团', '蚊虫小黑点', '小布头', '稀缝', '油点线', '飘絮']

model:
  backbone: dinov2
  dino_name: dinov2_vitb14
  dino_repo: facebookresearch/dinov2  # or an absolute path to a local checkout
  dino_weights: null                # optional official backbone-only .pth
  dino_pretrained: true             # first run loads OFFICIAL pretrained weights
  dino_freeze: true                 # train adapters/head first; no ViT backward memory
  dino_input_size: 448
  dino_lr_mult: 0.1                 # used only when dino_freeze=false
  reg_activation: softplus         # nonzero gradient even for negative distance logits
  detector_nms_iou: 0.5            # explicit class-aware NMS; this path is NOT NMS-free
  width: 0.75
  depth: 1.0
  stem_ch: 24
  detail_ch: 48
  p3_ch: 96
  p4_ch: 192
  p5_ch: 384
  num_blocks: [1, 1, 1]          # 原来是 [2,2,1]
  neck_blocks: 1
  head_width: 0.5
  attn_p5: true
  attn_heads: 6                  # 整除 c5 = 288 -> d = 48
  dwconv: true                   # 1660S 上若测出 DWConv 反而慢，设 false 做 A/B
  reflection_norm: true
  lcn_k: 11
  balance_p3: 1.0
  balance_p5: 1.0
  top_k: 150
  score_thresh: 0.05
  reg_scale: 1.0
  fg_align: true

normality:
  enabled: false
  grid: 64                       # 原 80
  out_grid: 128                  # 原 160（必须是 grid 的整数倍）
  patch_dim: 96                  # 原 128
  local_pool: 3
  n_prototypes: 8
  n_centroids: 128               # 原 256
  coreset_ratio: 0.1
  bank_method: spherical_kmeans
  seed: 0
  recon_dim: 192                 # 原 256
  recon_blocks: 2                # 原 4
  recon_heads: 6                 # 整除 192 -> d = 32
  recon_mlp_ratio: 2.0
  recon_ratio: 4.0
  dropout: 0.2
  jitter: 0.3
  rec_tau: 0.10
  rec_slope: 12.0
  fusion: fixed                  # 省掉一个可学习融合门
  alpha: 0.6
  beta: 0.4
  target_fpr: 0.005

fusion:
  anomaly_logit_gain: 1.0
  anomaly_thresh: 0.5
  large_area_ratio: 0.001
  min_iou_overlap: 0.1
  score_boost: 0.35
  box_margin: 1.15
  min_box_px: 24
  unknown_score_scale: 0.9
  emit_unknown_boxes: true        # 未知疵点类型也生成预测框（不止大缺陷兜底）
  unknown_min_area_ratio: 0.0002  # 比 large_area_ratio 更小，约 5 个 anomaly cell @160²
  unknown_peak_thresh: 0.55       # 小未知区域需要更高异常峰值，抑制噪声
  max_unknown_boxes: 20           # 每帧最多额外未知框（大缺陷框不受此限制）
  final_score_thresh: 0.15
  roi_head: false                # 关闭二级 ROI，分类仍由监督头 + 融合提供
  roi_hidden: 128
  roi_prior_weight: 0.5

train:
  loss_weights: {cls_o2m: 1.0, box_o2m: 2.0, obj_o2m: 1.0,
                 cls_o2o: 1.5, box_o2o: 2.0, obj_o2o: 1.5, fg_align: 0.5}
  class_weights: null
  o2o_candidates: 1200
  o2o_neg_ratio: 0.02       # per-scale hard negatives as a fraction of all cells
  o2o_min_neg: 2048         # floor for scales with few/no matches in a batch
  rec_p_final: 0.9
  rec_warmup: 1000
  rec_factor: 0.1
  rec_weight: 0.5
  best_metric: best_f1              # do not select by recall alone
  warmup_epochs: 1
  detector_epochs: 50
  detector_batch: 2
  detector_lr: 0.0005
  normality_iters: 10000
  normality_batch: 8
  normality_lr: 0.0005
  weight_decay: 0.0005

# Legacy offline-distillation options below are unused by the direct stage-A path.
dino:
  teacher: dinov2_vits14
  repo: facebookresearch/dinov2
  weights: null
  crop: 448
  iters: 5000
  batch: 4
  lr: 0.0005
  loss_weights: {n3: 1.0, n5: 1.0, rec: 1.0, patch: 0.5}

# 1660S 也要前景/背景分离；context 只有 3 通道，增加的 MACs < 0.05 G
foreground:
  enabled: false
  mode: local_global_attention
  hidden: 24                    # local conv branch channels
  attention_dim: 64             # global token dim (LinearAttention2)
  attention_heads: 4
  attention_blocks: 2
  boundary_kernel: 5            # ONLY smooths training pseudo labels, not deployed
  fold_attenuation: 0.80        # dynamic fold_band attenuation (no fixed edge pixels)
  texture_thresh: 0.20          # weave-energy -> pseudo fabric_mask
  slope: 30.0
  target_shrink: 0.08
  pos_weight: 5.0
  loss_weight: 0.5
  fabric_loss_weight: 1.0
  fold_loss_weight: 0.5
  global_loss_weight: 0.2
  fabric_mask_thresh: 0.30
  fold_band_thresh: 0.08
  defect_fg_thresh: 0.25
  min_fabric_frac: 0.50
  use_aspect_cue: false         # primary cue is learned fold_band, not shape heuristic
  fold_aspect_ratio: 3.0        # optional secondary cue
  fold_peak_override: 0.80

deploy:
  # 1660S 可以用 TensorRT，但 TU116 没有 Tensor Core；术语见 DEPLOYMENT.md §4.1
  half: false                    # 先 FP32，再 A/B 测 FP16（FP16 可能更慢）
  int8: false                    # 无 INT8 Tensor Core，DP4A 收益不确定
  opset: 17
