# FADNet-RT 总体配置（对应 docs/FADNet-RT_design.md §3）
project: FADNet-RT
version: 0.1.0

input:
  tile_size: 1280
  overlap: 0.15            # Tiling 重叠率
  strip_max_width: 2440    # 线扫条带最大宽度
  roi: {enabled: true, method: texture_energy, min_ratio: 0.05}
  flatfield: {enabled: true, win_frames: 200, downsample: 16}

preprocess:
  # U 分支输入分辨率；896 为速度/细节折中（Q4 确认后可设 1280）
  ustream_size: 896

sstream:                   # 监督分支 → configs/det_yolo27s_fabric.yaml
  detector_config: configs/det_yolo27s_fabric.yaml
  tau_det_low: 0.05        # 召回优先的低置信截断
  tau_det_heavy: 0.5       # 低于此且无异常区支撑的框降级 review
  class_temperature: 1.0

ustream:
  backbone: dinov3_vitsp16   # 冻结；DINOv2 权重非商用许可，注意 Q8
  backbone_ckpt: null        # Meta 申请后填本地路径
  freeze: true
  layers_recon: [3, 5, 7, 9] # Loose Reconstruction 分组取层
  recon:
    dropout_noise_p: 0.2     # Dinomaly Noisy Bottleneck：Dropout 即噪声注入
    decoder_layers: 3        # 线性注意力解码器层数
    gaussian_sigma: 4.0
  patchcore:
    neighborhood: 3          # 邻域感知聚合 3x3, stride 1
    coreset_size: 8192       # 贪心 k-center Coreset 目标中心数
    coreset_seed: 0
    knn_k: 1                 # 打分近邻数
    reweight_n: 4            # PatchCore 最近邻重加权参考数
  fusion: max                # 双信号级联：max（召回优先）；可选 logistic 标定

fabric_invariance:           # 免布种登记的布种自适应（用户要求 2026-10）
  # 思路：Dinomaly/PatchCore 前景-背景分离 + 逐 tile 自归一化 + 特征逐 tile 中心化
  # → 单一全局记忆库 + 全局通用阈值，换布种零配置。
  mode: self_norm            # 逐 tile 背景中位/p90 自归一化（heatmap.self_normalize）
  bg_quantile: 90
  style_center: true         # PatchCore 特征逐 tile 中心化（剥离布种风格偏移）
  memory_bank: global        # 单一全局记忆库（不分桶、不登记）
  thresholds: configs/thresholds.yaml
  mes_fabric_code: false     # 仅作台账字段，不参与模型/阈值

fhead:                     # F-Head 融合裁决规则（design §3.6）
  min_anom_area: 9         # 异常连通域最小面积(px@tile)
  large_area: 2500         # ≥ 视为大缺陷必报 [待 Q6 标定]
  iou_match: 0.0           # 框-区 IoU>0 即关联
  cross_tile_iou: 0.5      # 跨块归并 IoU
  unknown_class: unknown_anomaly
  promote_critical: true
  calibration: configs/class_calibration.yaml   # 逐类置信度标定（置信度↔严重度）

runtime:
  precision: fp16            # fp16 → int8
  backend: tensorrt
  dual_stream_parallel: true
  target_p95_ms: 25
